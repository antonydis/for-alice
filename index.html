<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faeef0">
  <meta name="description" content="An illustrated, interactive letter for Alice from Antony.">
  <title>For Alice ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main id="site" class="site">
    <section id="intro" class="view intro" aria-label="A letter for Alice">
      <div class="intro-glow" aria-hidden="true"></div>
      <div class="letter-shell">
        <div class="envelope" id="envelope" aria-hidden="true">
          <div class="envelope-back"></div>
          <div class="envelope-paper"></div>
          <div class="envelope-flap"></div>
          <div class="envelope-front"></div>
          <div class="envelope-address"><span class="to">To Alice</span><span class="from">from Antony</span></div>
          <div class="envelope-seal">♡</div>
        </div>
        <button id="begin" class="primary" type="button">Begin <span aria-hidden="true">♡</span></button>
        <time class="intro-date" datetime="2026-11-21">21 November</time>
      </div>
    </section>

    <section id="meeting" class="view meeting hidden" aria-label="Our paths crossed" aria-hidden="true">
      <div class="gallery-arch"></div>
      <div class="meeting-illustration" aria-hidden="true">
        <div class="meeting-floor"></div>
        <div id="meeting-him" class="meet-capy meet-capy--him"></div>
        <div id="meeting-her" class="meet-capy meet-capy--her"></div>
        <div class="meeting-spark">♡</div>
      </div>
    </section>

    <section id="gallery" class="view gallery hidden" aria-label="Our little gallery" aria-hidden="true">
      <div class="gallery-wall">
        <div class="spotlight spotlight--left" aria-hidden="true"></div>
        <div class="spotlight spotlight--right" aria-hidden="true"></div>
        <header class="gallery-header">
          <span class="gallery-mark" aria-hidden="true">✦</span>
          <span id="count" class="gallery-count" aria-live="polite">01 / 06</span>
          <span class="gallery-mark" aria-hidden="true">✦</span>
        </header>
        <div class="picture-area">
          <div class="frame-topshine" aria-hidden="true"></div>
          <div class="painting-frame">
            <div class="painting-mat">
              <div id="painting" class="painting" role="img" aria-label="Illustrated memory"></div>
            </div>
          </div>
          <div class="tiny-plaque" aria-hidden="true"><span>♡</span></div>
        </div>
        <div class="museum-baseboard" aria-hidden="true"></div>
        <div class="museum-floor" aria-hidden="true">
          <svg class="floor-path" viewBox="0 0 900 160" preserveAspectRatio="none">
            <path d="M42 112 C240 16 389 162 585 89 S777 54 869 89" fill="none" stroke="#b58aa8" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 19" opacity=".85"/>
          </svg>
          <div id="walk-duo" class="walk-duo"></div>
        </div>
      </div>
      <div class="gallery-controls">
        <button id="back" class="back" type="button" aria-label="Previous memory">←</button>
        <div id="steps" class="steps" aria-label="Journey progress"></div>
        <button id="next" class="primary primary--next" type="button">Keep walking <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <section id="ending" class="view ending hidden" aria-label="A note for Alice" aria-hidden="true">
      <div class="ending-card">
        <div id="ending-art" class="ending-art" aria-hidden="true"></div>
        <div class="ending-copy">
          <p>Conocerte ha hecho mi año mucho más feliz.</p>
          <p>Quiero vivir muchas más aventuras contigo.</p>
          <p class="chinese" lang="zh-Hans">亲爱的，我很喜欢你 ♡</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
